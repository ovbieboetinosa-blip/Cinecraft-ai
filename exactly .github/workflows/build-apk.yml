      - name: Build debug APK
        working-directory: CineCraftAI
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify the APK declares no INTERNET permission
        working-directory: CineCraftAI
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "INTERNET permission found - failing build"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CineCraftAI-debug-apk
          path: CineCraftAI/app/build/outputs/apk/debug/app-debug.apk
